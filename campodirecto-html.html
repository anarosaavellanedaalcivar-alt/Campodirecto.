      const [fobUsd, setFobUsd] = useState(28000);
      const [freightUsd, setFreightUsd] = useState(2150);
      const [insuranceUsd, setInsuranceUsd] = useState(310);
      const [portUsd, setPortUsd] = useState(420);
      const [customsUsd, setCustomsUsd] = useState(360);
      const [taxPct, setTaxPct] = useState(10);
      const [incoterm, setIncoterm] = useState("CIF");

      // Asistente CampoDirecto IA
      const [aiInput, setAiInput] = useState("");
      const [aiChat, setAiChat] = useState([
        {
          role: "ai",
          text: "¡Hola! Soy CampoDirecto AI ('Del productor al mundo, sin fronteras'). Pregúntame sobre el gemelo digital en Tulcán/Carchi, score de lotes, estimaciones FOB/CIF o mercados de exportación.",
        },
      ]);

      const triggerToast = (msg) => {
        setToastMsg(msg);
        setTimeout(() => setToastMsg(null), 3200);
      };

      const selectedField = useMemo(
        () => fields.find((f) => f.id === selectedFieldId) || fields[0],
        [fields, selectedFieldId]
      );

      const selectedExportScenario = useMemo(
        () => EXPORT_SCENARIOS.find((s) => s.id === twinExportScenarioId) || EXPORT_SCENARIOS[0],
        [twinExportScenarioId]
      );

      // Cálculos del Gemelo Digital conectado al lote seleccionado
      const twinSimulation = useMemo(() => {
        const projectedProduction = Math.round(selectedField.stock * (twinProductionPct / 100));
        const projectedDemand = Math.round(
          selectedField.stock * (twinDemandPct / 100) * selectedExportScenario.multiplier
        );
        const storageUtilizationPct = Math.min(
          100,
          Math.round((projectedProduction / Math.max(1, selectedField.storageCap)) * 100)
        );
        const storageOverflow = Math.max(0, projectedProduction - selectedField.storageCap);
        const adjustedRouteCostUsd = Number(
          (480 * (twinTransportPct / 100) * (selectedExportScenario.transitDays > 5 ? 2.4 : 1)).toFixed(2)
        );
        const simulatedRevenueUsd = Number(
          (Math.min(projectedProduction, projectedDemand) * selectedField.priceUsd).toFixed(2)
        );
        const twinHealthIndex = Math.min(
          100,
          Math.max(
            35,
            Math.round(
              selectedField.healthScore * 0.55 +
                (twinProductionPct * 0.25) +
                ((120 - twinTransportPct) * 0.2)
            )
          )
        );

        return {
          projectedProduction,
          projectedDemand,
          storageUtilizationPct,
          storageOverflow,
          adjustedRouteCostUsd,
          simulatedRevenueUsd,
          twinHealthIndex,
        };
      }, [
        selectedField,
        twinProductionPct,
        twinDemandPct,
        twinTransportPct,
        selectedExportScenario,
      ]);

      const totalAreaHa = useMemo(
        () => Number(fields.reduce((acc, f) => acc + Number(f.areaHa || 0), 0).toFixed(1)),
        [fields]
      );

      const avgHealthScore = useMemo(() => {
        if (!fields.length) return 0;
        return Math.round(fields.reduce((acc, f) => acc + f.healthScore, 0) / fields.length);
      }, [fields]);

      const activeFieldsCount = useMemo(
        () => fields.filter((f) => f.status === "Activo").length,
        [fields]
      );

      const filteredFields = useMemo(() => {
        const q = searchQuery.trim().toLowerCase();
        if (!q) return fields;
        return fields.filter(
          (f) =>
            f.name.toLowerCase().includes(q) ||
            f.crop.toLowerCase().includes(q) ||
            f.province.toLowerCase().includes(q) ||
            f.city.toLowerCase().includes(q)
        );
      }, [fields, searchQuery]);

      const cropDistribution = useMemo(() => {
        const grouped = {};
        fields.forEach((f) => {
          grouped[f.crop] = (grouped[f.crop] || 0) + Number(f.areaHa || 0);
        });
        const colors = ["#38b058", "#d5a642", "#67d97b", "#2d8a68", "#8bc34a", "#e0b85c"];

          crop,
          ha: Number(ha.toFixed(1)),
          pct: totalAreaHa > 0 ? Math.round((ha / totalAreaHa) * 100) : 0,
          color: colors[idx % colors.length],

        setFields((prev) =>

        const created = {

          province: newFieldProvince,

          unit: "quintales",
          stock: stockVal,
          minStock: 40,
          storageCap: Math.round(stockVal * 1.45),
          priceUsd: Number(newFieldPrice) || 20,
          quality: "Calidad Seleccionada",
          presentation: "Saco / Caja Comercial",
          lot: `LOT-${new Date().getFullYear()}-${Math.floor(100 + Math.random() * 899)}`,
          harvestDate: "2026-11-23",

                        value={portUsd}
                        onChange={(e) => setPortUsd(e.target.value)}
                        className="w-full px-2.5 py-2 rounded-xl bg-[#0e2016] border border-[#67d97b]/25 text-white"
                      />
                    </div>
                    <div>
                      <label className="block text-[#9ab5a5] mb-1">Aduana (USD)</label>
                      <input
                        type="number"
                        value={customsUsd}
                        onChange={(e) => setCustomsUsd(e.target.value)}
                        className="w-full px-2.5 py-2 rounded-xl bg-[#0e2016] border border-[#67d97b]/25 text-white"
                      />
                    </div>
                    <div>
                      <label className="block text-[#9ab5a5] mb-1">Tributo Est. (%)</label>
                      <input
                        type="number"
                        value={taxPct}
                        onChange={(e) => setTaxPct(e.target.value)}
                        className="w-full px-2.5 py-2 rounded-xl bg-[#0e2016] border border-[#67d97b]/25 text-white"
                      />
                    </div>
                  </div>

                  <div className="grid grid-cols-1 sm:grid-cols-3 gap-4 pt-2">
                    <div className="glass-subcard p-4">
                      <span className="text-xs text-[#9ab5a5] block">Valor CIF Estimado</span>
                      <span className="text-2xl font-extrabold text-[#67d97b]">
                        ${cifUsd.toLocaleString()}
                      </span>
                    </div>
                    <div className="glass-subcard p-4">
                      <span className="text-xs text-[#9ab5a5] block">Tributos Estimados ({taxPct}%)</span>
                      <span className="text-2xl font-extrabold text-[#d5a642]">
                        ${estimatedTaxesUsd.toLocaleString()}
                      </span>
                    </div>
                    <div className="glass-subcard p-4 border-[#67d97b]/40">
                      <span className="text-xs text-[#9ab5a5] block">Costo Total Estimado ({incoterm})</span>
                      <span className="text-2xl font-extrabold text-white">
                        ${totalLandedUsd.toLocaleString()}
                      </span>
                    </div>
                  </div>
                </div>
              )}

              {/* ===============================================================
                  VISTA: ECUADOR CATALOG (16 PRODUCTOS)
              =============================================================== */}
              {activeNav === "catalog" && (
                <div className="glass-panel p-6 space-y-4">
                  <div className="flex flex-wrap items-center justify-between gap-2">
                    <h2 className="text-lg font-extrabold text-white">
                      Catálogo Agrícola de Ecuador — Carchi y Provincias ({ECUADOR_CATALOG_ITEMS.length})
                    </h2>
                    <span className="text-xs text-[#9ab5a5]">Precios referenciales de demostración</span>
                  </div>
                  <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3.5">
                    {ECUADOR_CATALOG_ITEMS.map((item) => (
                      <div key={item.name} className="glass-subcard p-4 flex flex-col justify-between gap-3 text-xs">
                        <div>
                          <div className="flex items-center justify-between gap-2 mb-1">
                            <span className="font-extrabold text-sm text-white">{item.name}</span>
                            <span className="px-2 py-0.5 rounded bg-[#38b058]/20 text-[#67d97b] text-[10px] font-bold">
                              {item.tag}
                            </span>
                          </div>
                          <p className="text-[#9ab5a5]">{item.origin}</p>
                          <p className="text-emerald-100/90 mt-1.5">Calidad: {item.quality}</p>
                          <p className="text-[#9ab5a5] text-[11px]">Presentación: {item.presentation}</p>
                        </div>
                        <div className="pt-2 border-t border-[#67d97b]/15 flex items-baseline justify-between">
                          <span className="text-base font-extrabold text-[#d5a642]">
                            ${item.price.toFixed(2)}
                          </span>
                          <span className="text-[11px] text-[#9ab5a5]">/ {item.unit}</span>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              )}

              {/* ===============================================================
                  VISTA: QR TRACEABILITY & CAMPO AI CHAT
              =============================================================== */}
              {activeNav === "trace" && (
                <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
                  <div className="lg:col-span-5 glass-panel p-5 space-y-4">
                    <h2 className="text-base font-extrabold text-white">
                      Trazabilidad QR / Blockchain por Lote
                    </h2>
                    <select
                      value={selectedFieldId}
                      onChange={(e) => setSelectedFieldId(e.target.value)}
                      className="w-full px-3 py-2 rounded-xl bg-[#0e2016] border border-[#67d97b]/25 text-xs text-white"
                    >
                      {fields.map((f) => (
                        <option key={f.id} value={f.id}>
                          {f.lot} — {f.crop} ({f.province})
                        </option>
                      ))}
                    </select>

                    <div className="glass-subcard p-4 flex items-center gap-4">
                      <svg viewBox="0 0 100 100" className="w-24 h-24 shrink-0 bg-white p-1.5 rounded-xl">
                        <rect x="8" y="8" width="26" height="26" fill="none" stroke="#174D32" strokeWidth="6" />
                        <rect x="16" y="16" width="10" height="10" fill="#174D32" />
                        <rect x="66" y="8" width="26" height="26" fill="none" stroke="#174D32" strokeWidth="6" />
                        <rect x="74" y="16" width="10" height="10" fill="#174D32" />
                        <rect x="8" y="66" width="26" height="26" fill="none" stroke="#174D32" strokeWidth="6" />
                        <rect x="16" y="74" width="10" height="10" fill="#174D32" />
                        <rect x="44" y="14" width="12" height="12" fill="#36834A" />
                        <rect x="44" y="44" width="14" height="14" fill="#d5a642" />
                        <rect x="66" y="44" width="12" height="12" fill="#174D32" />
                        <rect x="44" y="70" width="24" height="12" fill="#36834A" />
                      </svg>
                      <div className="text-xs space-y-1">
                        <p className="font-bold text-white">{selectedField.crop}</p>
                        <p className="text-[#9ab5a5]">Productor: {selectedField.producer}</p>
                        <p className="text-[#9ab5a5]">Origen: {selectedField.city}, {selectedField.province}</p>
                        <p className="text-[#9ab5a5]">Cosecha: {selectedField.harvestDate}</p>
                        <p className="font-mono text-[11px] text-[#67d97b]">Hash Demo: {selectedField.txHash}</p>
                      </div>
                    </div>
                  </div>

                  <div className="lg:col-span-7 glass-panel p-5 space-y-4">
                    <h2 className="text-base font-extrabold text-white">
                      Asistente CampoDirecto AI
                    </h2>
                    <div className="space-y-2.5 max-h-64 overflow-y-auto glass-subcard p-3.5 text-xs">
                      {aiChat.map((m, idx) => (
                        <div
                          key={idx}
                          className={`p-3 rounded-xl max-w-[88%] ${
                            m.role === "ai"
                              ? "bg-[#152d20] border border-[#67d97b]/20 text-white"
                              : "bg-[#d5a642] text-[#0b1610] font-semibold ml-auto"
                          }`}
                        >
                          {m.text}
                        </div>
                      ))}
                    </div>
                    <form
                      onSubmit={(e) => {
                        e.preventDefault();
                        handleSendAi();
                      }}
                      className="flex gap-2"
                    >
                      <input
                        type="text"
                        value={aiInput}
                        onChange={(e) => setAiInput(e.target.value)}
                        placeholder="Pregunta sobre gemelo digital, Papa en Tulcán o CIF..."
                        className="flex-1 px-3.5 py-2.5 rounded-xl bg-[#0e2016] border border-[#67d97b]/25 text-xs text-white"
                      />
                      <button
                        type="submit"
                        className="px-4 py-2.5 rounded-xl bg-[#38b058] text-[#08150e] font-extrabold text-xs"
                      >
                        Enviar
                      </button>
                    </form>
                  </div>
                </div>
              )}

              {/* ===============================================================
                  VISTA: ROLES & SECURITY (11 PERFILES)
              =============================================================== */}
              {activeNav === "roles" && (
                <div className="glass-panel p-6 space-y-4 text-xs">
                  <h2 className="text-lg font-extrabold text-white">
                    Roles, Permisos y Seguridad — CampoDirecto
                  </h2>
                  <p className="text-[#9ab5a5]">
                    Rol activo: <strong className="text-[#67d97b]">{role}</strong>. Perfiles contemplados en el ecosistema CampoDirecto:
                  </p>
                  <div className="flex flex-wrap gap-2">
                    {ROLES_LIST.map((r) => (
                      <button
                        key={r}
                        onClick={() => {
                          setRole(r);
                          triggerToast(`Rol cambiado a ${r}`);
                        }}
                        className={`px-3 py-1.5 rounded-xl font-bold border transition ${
                          r === role
                            ? "bg-[#38b058] text-[#08150e] border-[#67d97b]"
                            : "bg-[#152c1f] text-emerald-100 border-[#67d97b]/20 hover:bg-[#1d3e2b]"
                        }`}
                      >
                        {r}
                      </button>
                    ))}
                  </div>
                </div>
              )}
            </main>
          </div>

          {showAllTasksModal && (
            <div className="fixed inset-0 z-50 bg-black/70 flex items-center justify-center p-4">
              <div className="glass-panel max-w-md w-full p-5 space-y-3 text-xs">
                <div className="flex items-center justify-between">
                  <h3 className="font-extrabold text-sm text-white">Todas las Tareas Operativas (ERP)</h3>
                  <button
                    onClick={() => setShowAllTasksModal(false)}
                    className="px-2 py-1 rounded-lg bg-white/10 text-white"
                  >
                    ✕
                  </button>
                </div>
                <div className="space-y-2">
                  {tasks.map((t) => (
                    <div key={t.id} className="glass-subcard p-3 flex justify-between items-center gap-2">
                      <div>
                        <p className="font-bold text-white">{t.title}</p>
                        <p className="text-[11px] text-[#9ab5a5]">{t.field} • {t.date}</p>
                      </div>
                      <span className="px-2 py-0.5 rounded bg-[#38b058]/20 text-[#67d97b] font-bold">
                        {t.status}
                      </span>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          )}

          {qrModalField && (
            <div className="fixed inset-0 z-50 bg-black/70 flex items-center justify-center p-4">
              <div className="glass-panel max-w-sm w-full p-5 space-y-3 text-xs">
                <div className="flex items-center justify-between">
                  <h3 className="font-extrabold text-white">Pasaporte QR — {qrModalField.lot}</h3>
                  <button
                    onClick={() => setQrModalField(null)}
                    className="px-2 py-1 rounded-lg bg-white/10 text-white"
                  >
                    ✕
                  </button>
                </div>
                <p className="text-[#9ab5a5]">
                  {qrModalField.crop} • {qrModalField.city}, {qrModalField.province}
                </p>
                <p className="font-mono text-[#67d97b]">Tx Simulación: {qrModalField.txHash}</p>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
